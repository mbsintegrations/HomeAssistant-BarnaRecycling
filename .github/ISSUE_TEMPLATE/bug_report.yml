name: Bug report
description: Report a reproducible problem without private account data
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: "Never attach credentials, portal HTML, customer PDFs or financial screenshots."
  - type: input
    id: versions
    attributes:
      label: Home Assistant and integration versions
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps and sanitized diagnostics
